name: Validate Android pull request

on:
  pull_request:
    branches: [main]
    paths:
      - "android-app/project/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list > /tmp/sdk-packages.txt
          PLATFORM_PACKAGE=$(awk -F'|' '/platforms;android-37|platforms;android-CinnamonBun/ { gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit }' /tmp/sdk-packages.txt)
          BUILD_TOOLS_PACKAGE=$(awk -F'|' '/build-tools;37\./ { gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1 }' /tmp/sdk-packages.txt | sort -V | tail -n 1)
          test -n "$PLATFORM_PACKAGE"
          if [ -n "$BUILD_TOOLS_PACKAGE" ]; then
            sdkmanager "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"
          else
            sdkmanager "$PLATFORM_PACKAGE"
          fi

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        working-directory: android-app/project
        run: gradle testDebugUnitTest -PHA_OAUTH_CLIENT_ID=https://gaboriaudn.github.io/suivi-alimentation-ha/

      - name: Build debug APK
        working-directory: android-app/project
        run: gradle assembleDebug -PHA_OAUTH_CLIENT_ID=https://gaboriaudn.github.io/suivi-alimentation-ha/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: suivi-alimentation-android-pr-apk
          path: android-app/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
