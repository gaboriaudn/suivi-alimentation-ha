name: Build Suivi Alimentation Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/project/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/project/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list > /tmp/sdk-packages.txt

          PLATFORM_PACKAGE=$(awk -F'|' '
            /platforms;android-37|platforms;android-CinnamonBun/ {
              gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit
            }
          ' /tmp/sdk-packages.txt)

          BUILD_TOOLS_PACKAGE=$(awk -F'|' '
            /build-tools;37\./ {
              gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1
            }
          ' /tmp/sdk-packages.txt | sort -V | tail -n 1)

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "Android 17/Cinnamon Bun platform package was not found." >&2
            grep -i -E 'Cinnamon|platforms;android-37' /tmp/sdk-packages.txt || true
            exit 1
          fi

          echo "Installing platform: $PLATFORM_PACKAGE"
          if [ -n "$BUILD_TOOLS_PACKAGE" ]; then
            echo "Installing build tools: $BUILD_TOOLS_PACKAGE"
            sdkmanager "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"
          else
            sdkmanager "$PLATFORM_PACKAGE"
          fi

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android-app/project/settings.gradle.kts
          test -f android-app/project/build.gradle.kts
          test -f android-app/project/app/build.gradle.kts
          test -f android-app/project/app/src/main/AndroidManifest.xml
          test -f android-app/project/app/src/main/java/com/suivialimentation/android/MainActivity.kt
          echo "Android source tree is present."

      - name: Run unit tests
        working-directory: android-app/project
        run: >-
          gradle testDebugUnitTest
          -PHA_OAUTH_CLIENT_ID=https://gaboriaudn.github.io/suivi-alimentation-ha/
          -PAPP_VERSION_CODE=${{ github.run_number }}

      - name: Prepare permanent signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/suivi-alimentation-release.jks"
          chmod 600 "$RUNNER_TEMP/suivi-alimentation-release.jks"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/suivi-alimentation-release.jks" >> "$GITHUB_ENV"

      - name: Build pull request APK
        if: github.event_name == 'pull_request'
        working-directory: android-app/project
        run: >-
          gradle assembleDebug
          -PHA_OAUTH_CLIENT_ID=https://gaboriaudn.github.io/suivi-alimentation-ha/
          -PAPP_VERSION_CODE=${{ github.run_number }}

      - name: Build permanently signed APK
        if: github.event_name != 'pull_request'
        working-directory: android-app/project
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: >-
          gradle assembleDebug
          -PHA_OAUTH_CLIENT_ID=https://gaboriaudn.github.io/suivi-alimentation-ha/
          -PAPP_VERSION_CODE=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: suivi-alimentation-android-apk-${{ github.run_number }}
          path: android-app/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
